<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>STRIKECORE — Push-Up Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0f1115;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    input, select, textarea {
      user-select: text;
      -webkit-user-select: text;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 17, 21, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.6); border-radius: 4px; }
    @keyframes ping-slow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .animate-ping-once {
      animation: ping-slow 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#0f1115] text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Audio Synthesizer (Zero External Dependencies) ---
    const playSynthSound = (type = 'rep') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'rep') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'complete') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'timer') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {
        console.warn('Audio context playback not permitted', e);
      }
    };

    const speakCount = (count) => {
      if ('speechSynthesis' in window && count > 0) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(String(count));
        utter.rate = 1.3;
        utter.pitch = 1.1;
        window.speechSynthesis.speak(utter);
      }
    };

    const triggerHaptic = () => {
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        navigator.vibrate(25);
      }
    };

    // --- Built-in SVG Icons ---
    const Icon = ({ name, className = "w-4 h-4" }) => {
      switch (name) {
        case 'activity':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path strokeLinecap="round" strokeLinejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>;
        case 'target':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        case 'flame':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 2c0 4.5-3.5 6-3.5 10a5.5 5.5 0 0011 0c0-4-3.5-5.5-3.5-10 0 0-2 2-4 0z"/></svg>;
        case 'calendar':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
        case 'award':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>;
        case 'plus':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        case 'minus':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        case 'rotate':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>;
        case 'check':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><polyline points="20 6 9 17 4 12"/></svg>;
        case 'timer':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        case 'play':
          return <svg className={className} fill="currentColor" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        case 'pause':
          return <svg className={className} fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>;
        case 'settings':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>;
        case 'trash':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>;
        case 'download':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        case 'maximize':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>;
        case 'minimize':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M4 14h6v6m10-10h-6V4m0 6l7-7M3 21l7-7"/></svg>;
        case 'volume':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>;
        case 'volumex':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>;
        case 'x':
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        default:
          return null;
      }
    };

    const VARIATIONS = ['Standard', 'Wide Grip', 'Diamond / Close Grip', 'Decline', 'Incline', 'Pike', 'Archer', 'Custom'];
    const getTodayStr = () => new Date().toISOString().split('T')[0];

    // --- Main App Component ---
    function App() {
      // Data State
      const [records, setRecords] = useState(() => {
        try {
          const saved = localStorage.getItem('pushup_records_v2');
          return saved ? JSON.parse(saved) : [
            { id: '1', date: getTodayStr(), count: 20, variation: 'Standard', timestamp: Date.now() - 3600000, setNumber: 1, notes: 'Warmup set' },
            { id: '2', date: getTodayStr(), count: 25, variation: 'Standard', timestamp: Date.now() - 1800000, setNumber: 2, notes: 'Good tempo' }
          ];
        } catch (e) { return []; }
      });

      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('pushup_settings_v2');
          return saved ? JSON.parse(saved) : {
            dailyTarget: 100,
            soundEnabled: true,
            voiceAnnounce: true,
            vibrateOnTap: true,
            autoStartRestTimer: true,
            defaultRestSeconds: 60
          };
        } catch (e) {
          return { dailyTarget: 100, soundEnabled: true, voiceAnnounce: true, vibrateOnTap: true, autoStartRestTimer: true, defaultRestSeconds: 60 };
        }
      });

      // UI State
      const [activeTab, setActiveTab] = useState('counter');
      const [currentReps, setCurrentReps] = useState(0);
      const [variation, setVariation] = useState('Standard');
      const [customVariation, setCustomVariation] = useState('');
      const [notes, setNotes] = useState('');
      const [isFloorMode, setIsFloorMode] = useState(false);
      const [ripples, setRipples] = useState([]);

      // Rest Timer State
      const [restTimeRemaining, setRestTimeRemaining] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [restDuration, setRestDuration] = useState(settings.defaultRestSeconds);

      // Modals
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedFilterVar, setSelectedFilterVar] = useState('All');

      // Sync LocalStorage
      useEffect(() => {
        localStorage.setItem('pushup_records_v2', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('pushup_settings_v2', JSON.stringify(settings));
      }, [settings]);

      // Timer Interval
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && restTimeRemaining > 0) {
          interval = setInterval(() => {
            setRestTimeRemaining((prev) => {
              if (prev <= 1) {
                if (settings.soundEnabled) playSynthSound('timer');
                triggerHaptic();
                setIsTimerRunning(false);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, restTimeRemaining, settings.soundEnabled]);

      // Keyboard Shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
          if (e.code === 'Space' || e.key === 'ArrowUp') {
            e.preventDefault();
            handleRepIncrement(1);
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            handleRepIncrement(-1);
          } else if (e.key === 'Enter') {
            e.preventDefault();
            if (currentReps > 0) handleLogSet();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentReps, variation, customVariation, notes]);

      // Metrics Computation
      const todayStr = getTodayStr();
      const todayRecords = records.filter(r => r.date === todayStr);
      const todayReps = todayRecords.reduce((acc, r) => acc + r.count, 0);
      const todaySetsCount = todayRecords.length;
      const todayGoalPercent = Math.min(100, Math.round((todayReps / settings.dailyTarget) * 100));

      const currentStreak = useMemo(() => {
        const uniqueDates = Array.from(new Set(records.map(r => r.date))).sort().reverse();
        if (uniqueDates.length === 0) return 0;
        let streak = 0;
        let checkDate = new Date();
        if (!uniqueDates.includes(todayStr)) {
          checkDate.setDate(checkDate.getDate() - 1);
        }
        while (true) {
          const dStr = checkDate.toISOString().split('T')[0];
          if (uniqueDates.includes(dStr)) {
            streak++;
            checkDate.setDate(checkDate.getDate() - 1);
          } else {
            break;
          }
        }
        return streak;
      }, [records, todayStr]);

      // Rep Increment Handler
      const handleRepIncrement = (amount, e) => {
        const next = Math.max(0, currentReps + amount);
        setCurrentReps(next);

        if (amount > 0) {
          if (settings.soundEnabled) playSynthSound('rep');
          if (settings.vibrateOnTap) triggerHaptic();
          if (settings.voiceAnnounce && next > 0 && (next <= 5 || next % 5 === 0)) {
            speakCount(next);
          }

          if (e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = (e.clientX || (rect.left + rect.width / 2)) - rect.left;
            const y = (e.clientY || (rect.top + rect.height / 2)) - rect.top;
            const newRip = { id: Date.now() + Math.random(), x, y };
            setRipples(prev => [...prev.slice(-4), newRip]);
            setTimeout(() => {
              setRipples(prev => prev.filter(r => r.id !== newRip.id));
            }, 600);
          }
        }
      };

      // Log Current Set
      const handleLogSet = () => {
        if (currentReps <= 0) return;
        const newRecord = {
          id: String(Date.now()),
          date: todayStr,
          count: currentReps,
          variation: variation === 'Custom' && customVariation ? customVariation : variation,
          timestamp: Date.now(),
          setNumber: todaySetsCount + 1,
          notes: notes.trim()
        };
        setRecords(prev => [newRecord, ...prev]);
        if (settings.soundEnabled) playSynthSound('complete');
        triggerHaptic();

        // Reset
        setCurrentReps(0);
        setNotes('');
        setIsFloorMode(false);

        // Auto Start Rest Timer
        if (settings.autoStartRestTimer) {
          setRestTimeRemaining(settings.defaultRestSeconds);
          setIsTimerRunning(true);
        }
      };

      // Export CSV
      const handleExportCSV = () => {
        const headers = 'ID,Date,SetNumber,Reps,Variation,Notes,Timestamp\n';
        const rows = records.map(r => `"${r.id}","${r.date}",${r.setNumber || 1},${r.count},"${r.variation}","${(r.notes || '').replace(/"/g, '""')}","${new Date(r.timestamp).toISOString()}"`).join('\n');
        const blob = new Blob([headers + rows], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `strikecore_pushups_${todayStr}.csv`;
        a.click();
      };

      return (
        <div className="flex flex-col min-h-screen justify-between pb-24 sm:pb-8">
          {/* Header */}
          <header className="sticky top-0 z-30 border-b border-slate-800/80 bg-[#0f1115]/90 backdrop-blur-md px-4 py-3 sm:px-6">
            <div className="mx-auto max-w-3xl flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-sky-400 to-sky-600 text-slate-950 shadow-lg shadow-sky-500/20">
                  <Icon name="activity" className="w-5 h-5 stroke-[2.5]" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-base font-extrabold tracking-tight text-white sm:text-lg">
                      STRIKE<span className="text-sky-400">CORE</span>
                    </span>
                    {currentStreak > 0 && (
                      <div className="flex items-center gap-1 rounded-full bg-amber-500/10 px-2 py-0.5 text-[11px] font-bold text-amber-400 border border-amber-500/20">
                        <Icon name="flame" className="w-3 h-3 text-amber-400" />
                        <span>{currentStreak}d</span>
                      </div>
                    )}
                  </div>
                  <p className="text-[10px] uppercase tracking-widest text-slate-500 font-medium hidden sm:block">Push-Up Performance Tracker</p>
                </div>
              </div>

              {/* Header Right Actions */}
              <div className="flex items-center gap-2">
                {/* Today's Goal Ring */}
                <div className="flex items-center gap-2 rounded-xl border border-slate-700/50 bg-slate-800/50 px-2.5 py-1 text-xs">
                  <div className="relative flex h-6 w-6 items-center justify-center">
                    <svg className="h-6 w-6 -rotate-90" viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="3" className="text-slate-800" fill="none" />
                      <circle cx="12" cy="12" r="9" stroke="currentColor" strokeWidth="3" strokeDasharray="56.5" strokeDashoffset={56.5 - (56.5 * todayGoalPercent) / 100} strokeLinecap="round" className="text-sky-400 transition-all duration-500" fill="none" />
                    </svg>
                    <Icon name="target" className="absolute w-2.5 h-2.5 text-slate-400" />
                  </div>
                  <div className="text-left">
                    <span className="font-mono-num font-bold text-sky-400 text-sm leading-none">{todayReps}</span>
                    <span className="text-[10px] text-slate-500">/{settings.dailyTarget}</span>
                  </div>
                </div>

                {/* Sound Toggle */}
                <button
                  onClick={() => setSettings(s => ({ ...s, soundEnabled: !s.soundEnabled }))}
                  className={`flex h-9 w-9 items-center justify-center rounded-lg border transition-colors ${
                    settings.soundEnabled ? 'border-slate-700/50 bg-slate-800/60 text-sky-400' : 'border-slate-800 bg-slate-900/50 text-slate-500'
                  }`}
                  title={settings.soundEnabled ? 'Sound On' : 'Sound Off'}
                >
                  <Icon name={settings.soundEnabled ? 'volume' : 'volumex'} className="w-4 h-4" />
                </button>

                {/* Settings Toggle */}
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-700/50 bg-slate-800/60 text-slate-400 hover:text-slate-100"
                >
                  <Icon name="settings" className="w-4 h-4" />
                </button>
              </div>
            </div>

            {/* Desktop Tabs */}
            <div className="mx-auto max-w-3xl mt-3 hidden sm:flex items-center gap-1 rounded-xl border border-slate-800/80 bg-slate-900/60 p-1">
              <button
                onClick={() => setActiveTab('counter')}
                className={`flex flex-1 items-center justify-center gap-2 rounded-lg py-2 text-xs font-semibold transition-all ${
                  activeTab === 'counter' ? 'bg-slate-800 text-sky-400 border border-slate-700/40 shadow-sm' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Icon name="activity" className="w-3.5 h-3.5" /> Counter
              </button>
              <button
                onClick={() => setActiveTab('history')}
                className={`flex flex-1 items-center justify-center gap-2 rounded-lg py-2 text-xs font-semibold transition-all ${
                  activeTab === 'history' ? 'bg-slate-800 text-sky-400 border border-slate-700/40 shadow-sm' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Icon name="calendar" className="w-3.5 h-3.5" /> Workout Logs
              </button>
              <button
                onClick={() => setActiveTab('stats')}
                className={`flex flex-1 items-center justify-center gap-2 rounded-lg py-2 text-xs font-semibold transition-all ${
                  activeTab === 'stats' ? 'bg-slate-800 text-sky-400 border border-slate-700/40 shadow-sm' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Icon name="award" className="w-3.5 h-3.5" /> Analytics
              </button>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="mx-auto max-w-3xl w-full px-4 py-4 sm:py-6">
            {/* COUNTER VIEW */}
            {activeTab === 'counter' && (
              <div className="space-y-4">
                {/* Floor Mode Fullscreen Overlay */}
                {isFloorMode && (
                  <div
                    onClick={(e) => handleRepIncrement(1, e)}
                    className="fixed inset-0 z-50 flex flex-col items-center justify-between bg-[#0f1115] p-6 select-none cursor-pointer"
                  >
                    <div className="flex w-full items-center justify-between">
                      <span className="flex items-center gap-2 text-sky-400 text-xs font-semibold animate-pulse">
                        <Icon name="activity" className="w-4 h-4" /> Floor Nose/Chin Tap Mode
                      </span>
                      <button
                        onClick={(e) => { e.stopPropagation(); setIsFloorMode(false); }}
                        className="flex items-center gap-1 rounded-full bg-slate-800 px-3.5 py-1.5 text-xs font-semibold text-slate-200"
                      >

                      step="10"
                      value={settings.dailyTarget}
                      onChange={e => setSettings(s => ({ ...s, dailyTarget: parseInt(e.target.value) }))}
                      className="w-full accent-sky-500 cursor-pointer"
                    />
                  </div>

                  <div className="rounded-2xl border border-slate-800 bg-slate-950/60 p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <span>Sound Effects</span>
                      <input type="checkbox" checked={settings.soundEnabled} onChange={e => setSettings(s => ({ ...s, soundEnabled: e.target.checked }))} className="accent-sky-500 h-4 w-4" />
                    </div>
                    <div className="flex items-center justify-between">
                      <span>Voice Count Announcements</span>
                      <input type="checkbox" checked={settings.voiceAnnounce} onChange={e => setSettings(s => ({ ...s, voiceAnnounce: e.target.checked }))} className="accent-sky-500 h-4 w-4" />
                    </div>
                    <div className="flex items-center justify-between">
                      <span>Haptic Vibration on Tap</span>
                      <input type="checkbox" checked={settings.vibrateOnTap} onChange={e => setSettings(s => ({ ...s, vibrateOnTap: e.target.checked }))} className="accent-sky-500 h-4 w-4" />
                    </div>
                    <div className="flex items-center justify-between">
                      <span>Auto-Start Rest Timer</span>
                      <input type="checkbox" checked={settings.autoStartRestTimer} onChange={e => setSettings(s => ({ ...s, autoStartRestTimer: e.target.checked }))} className="accent-sky-500 h-4 w-4" />
                    </div>
                  </div>

                  <div className="pt-2 flex justify-between gap-2">
                    <button
                      onClick={() => {
                        if (confirm('Clear all push-up records?')) setRecords([]);
                      }}
                      className="rounded-xl border border-rose-500/20 bg-rose-500/10 px-3 py-2 text-rose-400 font-semibold"
                    >
                      Clear Data
                    </button>
                    <button onClick={() => setIsSettingsOpen(false)} className="rounded-xl bg-gradient-to-r from-sky-400 to-sky-500 px-5 py-2 font-bold text-slate-950">
                      Done
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
