        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'rep') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);

    // CSV Parser
    function parseCSVLine(text) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          if (inQuotes && text[i + 1] === '"') { cur += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(cur.trim());
          cur = '';
        } else {
          cur += char;
        }
      }
      result.push(cur.trim());
      return result;
    }

    function parseCSVText(csvText) {
      const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) return { records: [], errors: ['File is empty.'] };

      const records = [];
      const headerTokens = parseCSVLine(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
      
      let dateIdx = headerTokens.findIndex(h => h.includes('date'));
      let countIdx = headerTokens.findIndex(h => h.includes('count') || h.includes('rep') || h.includes('pushup'));
      let varIdx = headerTokens.findIndex(h => h.includes('var') || h.includes('type') || h.includes('style'));
      let setIdx = headerTokens.findIndex(h => h.includes('set'));
      let notesIdx = headerTokens.findIndex(h => h.includes('note') || h.includes('desc'));

      let startLine = 1;
      if (countIdx === -1) {
        dateIdx = 0; countIdx = 2; varIdx = 3; setIdx = 4; notesIdx = 5;
        startLine = 0;
      }

      for (let i = startLine; i < lines.length; i++) {
        const tokens = parseCSVLine(lines[i]);
        if (tokens.length === 0 || tokens.every(t => !t)) continue;

        const rawCount = countIdx !== -1 && countIdx < tokens.length ? tokens[countIdx] : '';
        const count = parseInt(rawCount.replace(/[^0-9]/g, ''), 10);
        if (isNaN(count) || count <= 0) continue;

        let dateVal = dateIdx !== -1 && dateIdx < tokens.length ? tokens[dateIdx] : getTodayStr();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateVal)) {
          const dObj = new Date(dateVal);
          if (!isNaN(dObj.getTime())) dateVal = dObj.toISOString().split('T')[0];
        }

        const variation = varIdx !== -1 && varIdx < tokens.length && tokens[varIdx] ? tokens[varIdx] : 'Standard';
        const setNumber = setIdx !== -1 && setIdx < tokens.length ? parseInt(tokens[setIdx], 10) || 1 : 1;
        const notes = notesIdx !== -1 && notesIdx < tokens.length ? tokens[notesIdx] : '';

        records.push({
          id: `csv-${Date.now()}-${i}-${Math.random().toString(36).substring(2, 6)}`,
          date: dateVal,
          count,
          variation,
          setNumber,
          notes,
          timestamp: Date.now() - (lines.length - i) * 60000
        });
      }
      return { records };
    }

    // Gamification Engine for 25 Levels
    function computeGamification(records, dailyTarget) {
      const todayStr = getTodayStr();
      const totalReps = records.reduce((sum, r) => sum + r.count, 0);

      const dateMap = {};
      records.forEach(r => {
        if (!dateMap[r.date]) dateMap[r.date] = [];
        dateMap[r.date].push(r);
      });

      const todayRecords = dateMap[todayStr] || [];
      const todayReps = todayRecords.reduce((sum, r) => sum + r.count, 0);
      const todayVariations = new Set(todayRecords.map(r => r.variation));
      const maxTodaySet = todayRecords.length > 0 ? Math.max(...todayRecords.map(r => r.count)) : 0;
      const bestLifetimeSet = records.length > 0 ? Math.max(...records.map(r => r.count)) : 0;

      let daysGoalMet = 0;
      Object.values(dateMap).forEach(recs => {
        const sum = recs.reduce((a, b) => a + b.count, 0);
        if (sum >= dailyTarget) daysGoalMet++;
      });

      let streak = 0;
      const checkDate = new Date();
      const activeDates = new Set(Object.keys(dateMap));
      if (!activeDates.has(todayStr)) {
        checkDate.setDate(checkDate.getDate() - 1);
      }
      while (activeDates.has(checkDate.toISOString().split('T')[0])) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      }

      const streakMultiplier = 1 + Math.min(0.5, streak * 0.05);
      let rawXp = totalReps * 10 + daysGoalMet * 200 + records.length * 15;
      const totalXp = Math.round(rawXp * streakMultiplier);

      let currentLevelIdx = 0;
      for (let i = LEVEL_THRESHOLDS.length - 1; i >= 0; i--) {
        if (totalXp >= LEVEL_THRESHOLDS[i].xp) {
          currentLevelIdx = i;
          break;
        }
      }
      const curLvl = LEVEL_THRESHOLDS[currentLevelIdx];
      const nextLvl = LEVEL_THRESHOLDS[currentLevelIdx + 1] || {
        level: curLvl.level + 1,
        xp: curLvl.xp + 25000,
        title: 'Infinite Sovereign',
        rank: 'Legend',
        icon: 'star'
      };

      const progressInLevel = Math.max(0, totalXp - curLvl.xp);
      const xpNeeded = Math.max(1, nextLvl.xp - curLvl.xp);
      const progressPercent = Math.min(100, Math.round((progressInLevel / xpNeeded) * 100));

      const levelInfo = {
        level: curLvl.level,
        title: curLvl.title,
        rank: curLvl.rank,
        currentLevelXp: progressInLevel,
        nextLevelXp: xpNeeded,
        progressPercent,
        totalXp,
      };

      const quests = [
        {
          id: 'q-daily-target',
          title: 'SHNOI Daily Protocol',
          desc: `Reach your daily target of ${dailyTarget} push-ups`,
          rewardXp: 250,
          current: todayReps,
          target: dailyTarget,
          completed: todayReps >= dailyTarget
        },
        {
          id: 'q-power-set',
          title: 'Power Surge Set',
          desc: 'Execute a single set of 20+ reps',
          rewardXp: 100,
          current: maxTodaySet,
          target: 20,
          completed: maxTodaySet >= 20
        },
        {
          id: 'q-variety',
          title: 'Form Specialist',
          desc: 'Log 2 distinct variations in a single day',
          rewardXp: 150,
          current: todayVariations.size,
          target: 2,
          completed: todayVariations.size >= 2
        }
      ];

      const achievements = [
        {
          id: 'first-strike',
          title: 'First SHNOI Protocol',
          desc: 'Log your first push-up set',
          tier: 'bronze',
          progress: Math.min(1, records.length),
          max: 1,
          unlocked: records.length >= 1,
          rewardXp: 50,
          icon: 'zap'
        },
        {
          id: 'century-club',
          title: 'Century Monarch',
          desc: 'Complete 100+ push-ups in a single day',
          tier: 'silver',
          progress: Math.min(100, todayReps),
          max: 100,
          unlocked: Object.values(dateMap).some(d => d.reduce((a, b) => a + b.count, 0) >= 100),
          rewardXp: 250,
          icon: 'award'
        },
        {
          id: 'streak-3',
          title: 'Iron Consistency',
          desc: 'Maintain a 3-day active streak',
          tier: 'silver',
          progress: Math.min(3, streak),
          max: 3,
          unlocked: streak >= 3,
          rewardXp: 300,
          icon: 'flame'
        },
        {
          id: 'streak-14',
          title: 'SHNOI Discipline Sovereign',
          desc: 'Maintain a 14-day workout streak',
          tier: 'platinum',
          progress: Math.min(14, streak),
          max: 14,
          unlocked: streak >= 14,
          rewardXp: 1200,
          icon: 'crown'
        },
        {
          id: 'rep-500',
          title: 'Iron Foundation',
          desc: 'Reach 500 lifetime push-ups',
          tier: 'silver',
          progress: Math.min(500, totalReps),
          max: 500,
          unlocked: totalReps >= 500,
          rewardXp: 400,
          icon: 'shield'
        },
        {
          id: 'rep-1000',
          title: 'Centurion Legend',
          desc: 'Reach 1,000 lifetime push-ups',
          tier: 'gold',
          progress: Math.min(1000, totalReps),
          max: 1000,
          unlocked: totalReps >= 1000,
          rewardXp: 1000,
          icon: 'crown'
        },
        {
          id: 'rep-5000',
          title: 'Apex Sovereign',
          desc: 'Reach 5,000 lifetime push-ups',
          tier: 'mythic',
          progress: Math.min(5000, totalReps),
          max: 5000,
          unlocked: totalReps >= 5000,
          rewardXp: 3000,
          icon: 'star'
        },
        {
          id: 'rep-10000',
          title: 'SHNOI Immortal Legend',
          desc: 'Achieve 10,000 total lifetime push-ups',
          tier: 'mythic',
          progress: Math.min(10000, totalReps),
          max: 10000,
          unlocked: totalReps >= 10000,
          rewardXp: 6000,
          icon: 'trophy'
        }
      ];

      return { levelInfo, quests, achievements, streakMultiplier, streak, totalXp };
    }

      // Keyboard Shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
          if (e.code === 'Space' || e.key === 'ArrowUp') {

      const todayStr = getTodayStr();

        const bestSingleSet = totalSets > 0 ? Math.max(...records.map(r => r.count)) : 0;

        const dayMap = {};
        records.forEach(r => { dayMap[r.date] = (dayMap[r.date] || 0) + r.count; });
        const activeDaysCount = Object.keys(dayMap).length;
        const avgRepsPerActiveDay = activeDaysCount > 0 ? Math.round(totalReps / activeDaysCount) : 0;
        const maxDayReps = activeDaysCount > 0 ? Math.max(...Object.values(dayMap)) : 0;

        const estimatedCalories = Math.round(totalReps * 0.32);
        const totalTonnageKg = ((totalReps * 48) / 1000).toFixed(1);

        const varCounts = {};
        records.forEach(r => {
          const vName = r.variation || 'Standard';
          varCounts[vName] = (varCounts[vName] || 0) + r.count;

        const variationBreakdown = Object.entries(varCounts)
          .map(([name, count]) => ({

        const last30Days = [];
        for (let i = 29; i >= 0; i--) {

          d.setDate(d.getDate() - i);

        return {

          avgRepsPerSet,
          bestSingleSet,
          avgRepsPerActiveDay,
          maxDayReps,
          estimatedCalories,
          totalTonnageKg,
          variationBreakdown,
          last30Days
        };
      }, [records, settings.dailyTarget]);

      const handleRepIncrement = (amount, e) => {

          if (e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = (e.clientX || (rect.left + rect.width / 2)) - rect.left;

                            <span className={`text-[11px] font-mono-num font-extrabold ${q.completed ? 'text-emerald-400' : themeCfg.accentText}`}>+{q.rewardXp} XP</span>
                          </div>
                          <p className="text-[11px] text-slate-400 mt-1 leading-snug">{q.desc}</p>
                        </div>
                        <div className="mt-4 pt-3 border-t border-slate-800/50">
                          <div className="flex items-center justify-between text-[11px] mb-1">
                            <span className="text-slate-400 font-mono-num">{q.current} / {q.target}</span>
                            {q.completed ? <span className="font-bold text-emerald-400 text-[10px]">Claimed</span> : <span className="text-slate-500 text-[10px]">In Progress</span>}
                          </div>
                          <div className="h-1.5 w-full overflow-hidden rounded-full bg-slate-900">
                            <div className={`h-full rounded-full ${q.completed ? 'bg-emerald-400' : `bg-gradient-to-r ${themeCfg.accentGradient}`}`} style={{ width: `${Math.min(100, Math.round((q.current / q.target) * 100))}%` }} />
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Core KPI Statistics Grid */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <div className="rounded-2xl border border-slate-800/80 bg-slate-900/40 p-4 shadow-lg backdrop-blur-xl">
                    <span className="uppercase tracking-wider text-[10px] font-bold text-slate-400 block mb-1">Lifetime Volume</span>
                    <div className="font-mono-num text-2xl font-extrabold text-white">{analytics.totalReps.toLocaleString()}</div>
                    <span className="text-[10px] text-slate-500 font-medium">Across {analytics.totalSets} sets</span>
                  </div>
                  <div className="rounded-2xl border border-slate-800/80 bg-slate-900/40 p-4 shadow-lg backdrop-blur-xl">
                    <span className="uppercase tracking-wider text-[10px] font-bold text-slate-400 block mb-1">Estimated Energy</span>
                    <div className="font-mono-num text-2xl font-extrabold text-amber-400">{analytics.estimatedCalories} <span className="text-xs text-slate-400 font-semibold">kcal</span></div>
                    <span className="text-[10px] text-slate-500 font-medium">~0.32 kcal / pushup</span>
                  </div>
                  <div className="rounded-2xl border border-slate-800/80 bg-slate-900/40 p-4 shadow-lg backdrop-blur-xl">
                    <span className="uppercase tracking-wider text-[10px] font-bold text-slate-400 block mb-1">Best Single Set</span>
                    <div className={`font-mono-num text-2xl font-extrabold ${themeCfg.accentText}`}>{analytics.bestSingleSet} <span className="text-xs text-slate-400 font-semibold">reps</span></div>
                    <span className="text-[10px] text-slate-500 font-medium">Avg: {analytics.avgRepsPerSet} reps/set</span>
                  </div>
                  <div className="rounded-2xl border border-slate-800/80 bg-slate-900/40 p-4 shadow-lg backdrop-blur-xl">
                    <span className="uppercase tracking-wider text-[10px] font-bold text-slate-400 block mb-1">Tonnage Moved</span>
                    <div className="font-mono-num text-2xl font-extrabold text-sky-400">{analytics.totalTonnageKg} <span className="text-xs text-slate-400 font-semibold">Tons</span></div>
                    <span className="text-[10px] text-slate-500 font-medium">Bodyweight resistance</span>
                  </div>
                </div>

                {/* 30-Day Activity Heatmap Matrix */}
                <div className="rounded-3xl border border-slate-800/80 bg-slate-900/40 p-5 sm:p-6 shadow-xl backdrop-blur-xl">
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      <Icon name="calendar" className={`w-4 h-4 ${themeCfg.accentText}`} /> 30-Day Consistency Matrix
                    </h3>
                    <div className="flex items-center gap-2 text-[10px] text-slate-400">
                      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-slate-800 inline-block"/> Rest</span>
                      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-amber-700/60 inline-block"/> Active</span>
                      <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded bg-[#E5C378] inline-block"/> Goal Met</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-6 sm:grid-cols-10 gap-2">
                    {analytics.last30Days.map(d => {
                      let bg = 'bg-slate-800/60 border-slate-700/40';
                      if (d.met) bg = 'bg-[#E5C378] text-slate-950 border-[#E5C378] shadow-[0_0_8px_rgba(229,195,120,0.4)]';
                      else if (d.reps > 0) bg = 'bg-amber-800/60 text-amber-200 border-amber-600/50';

                      return (
                        <div
                          key={d.date}
                          className={`flex flex-col items-center justify-center p-2 rounded-xl border text-center transition-transform hover:scale-105 ${bg}`}
                          title={`${d.date}: ${d.reps} push-ups`}
                        >
                          <span className="text-[9px] opacity-75 font-mono-num">{d.date.slice(5)}</span>
                          <span className="text-xs font-mono-num font-bold">{d.reps > 0 ? d.reps : '-'}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Push-Up Variation Breakdown */}
                <div className="rounded-3xl border border-slate-800/80 bg-slate-900/40 p-5 sm:p-6 shadow-xl backdrop-blur-xl">
                  <h3 className="text-sm font-bold text-white flex items-center gap-2 mb-4">
                    <Icon name="award" className={`w-4 h-4 ${themeCfg.accentText}`} /> Grip & Variation Distribution
                  </h3>
                  <div className="space-y-3">
                    {analytics.variationBreakdown.map(v => (
                      <div key={v.name} className="space-y-1">
                        <div className="flex items-center justify-between text-xs">
                          <span className="font-semibold text-slate-300">{v.name}</span>
                          <span className="font-mono-num font-bold text-white">{v.count} reps ({v.percent}%)</span>
                        </div>
                        <div className="h-2 w-full overflow-hidden rounded-full bg-slate-800">
                          <div className={`h-full rounded-full bg-gradient-to-r ${themeCfg.accentGradient}`} style={{ width: `${v.percent}%` }} />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Achievements Trophy Badges Case */}
                <div className="rounded-3xl border border-slate-800/80 bg-slate-900/40 p-5 sm:p-6 shadow-xl backdrop-blur-xl">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-sm font-bold text-white flex items-center gap-2">
                      <Icon name="trophy" className={`w-4 h-4 ${themeCfg.accentText}`} /> SHNOI Achievements & Trophies
                    </h3>
                    <span className="text-xs text-slate-400">
                      {gamification.achievements.filter(a => a.unlocked).length} / {gamification.achievements.length} Unlocked
                    </span>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    {gamification.achievements.map(badge => (
                      <div key={badge.id} className={`flex items-start gap-3 rounded-2xl border p-3.5 transition-all ${badge.unlocked ? 'border-slate-700/80 bg-slate-950/70 shadow-md' : 'border-slate-800/50 bg-slate-950/30 opacity-50'}`}>
                        <div className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl border ${badge.unlocked ? `${themeCfg.accentBgLight} ${themeCfg.accentBorderLight} ${themeCfg.accentText}` : 'border-slate-800 text-slate-600'}`}>
                          <Icon name={badge.icon} className="w-5 h-5" />
                        </div>
                        <div className="min-w-0 flex-1">
                          <span className="block text-xs font-bold text-white truncate">{badge.title}</span>
                          <span className="block text-[10px] text-slate-400 leading-tight mt-0.5">{badge.desc}</span>
                          <div className="mt-2 flex items-center justify-between text-[10px] text-slate-500 font-mono-num">
                            <span>{badge.progress}/{badge.max}</span>
                            <span className={`font-bold ${themeCfg.accentText}`}>+{badge.rewardXp} XP</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Sticky Mobile Bottom Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 border-t border-slate-800/90 bg-[#0a0907]/95 backdrop-blur-xl sm:hidden px-3 pt-2 pb-3">
            <div className="flex items-center justify-around">
              <button onClick={() => setActiveTab('counter')} className={`flex flex-col items-center ${activeTab === 'counter' ? `${themeCfg.accentText} font-extrabold` : 'text-slate-400'}`}>
                <Icon name="activity" className="w-5 h-5 mb-0.5" />
                <span className="text-[10px]">Counter</span>
              </button>
              <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center ${activeTab === 'history' ? `${themeCfg.accentText} font-extrabold` : 'text-slate-400'}`}>
                <Icon name="calendar" className="w-5 h-5 mb-0.5" />
                <span className="text-[10px]">Logs</span>
              </button>
              <button onClick={() => setIsAddModalOpen(true)} className={`flex h-11 w-11 -mt-4 items-center justify-center rounded-full ${themeCfg.accentBtn} active:scale-95 transition-transform`}>
                <Icon name="plus" className="w-6 h-6 stroke-[2.5]" />
              </button>
              <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center ${activeTab === 'stats' ? `${themeCfg.accentText} font-extrabold` : 'text-slate-400'}`}>
                <Icon name="trophy" className="w-5 h-5 mb-0.5" />
                <span className="text-[10px]">25 Ranks</span>
              </button>
              <button onClick={() => setIsSettingsOpen(true)} className="flex flex-col items-center text-slate-400">
                <Icon name="settings" className="w-5 h-5 mb-0.5" />
                <span className="text-[10px]">Settings</span>
              </button>
            </div>
          </nav>

          {/* Celebration Modal */}
          {celebration && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-md">
              <div className="w-full max-w-sm rounded-3xl border border-slate-700/80 bg-slate-900/95 p-6 text-center shadow-2xl backdrop-blur-2xl">
                <div className="mx-auto flex h-20 w-20 items-center justify-center rounded-3xl bg-gradient-to-tr from-slate-800 to-slate-900 border border-slate-700/60 shadow-xl relative">
                  <Icon name="trophy" className={`w-10 h-10 ${themeCfg.accentText}`} />
                </div>
                <h3 className="text-xl font-black text-white mt-4">{celebration.title}</h3>
                <p className="text-xs text-slate-300 mt-2">{celebration.subtitle}</p>
                <button
                  onClick={() => setCelebration(null)}
                  className={`mt-6 w-full rounded-2xl ${themeCfg.accentBtn} py-3 text-xs font-black uppercase tracking-wider`}
                >
                  Continue SHNOI Protocol
                </button>
              </div>
            </div>
          )}

          {/* Classy Theme Selector Modal */}
          {isThemeModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900/95 p-6 shadow-2xl backdrop-blur-xl">
                <div className="flex items-center justify-between border-b border-slate-800/80 pb-3">
                  <div className="flex items-center gap-2">
                    <Icon name="palette" className="w-5 h-5 text-white" />
                    <div>
                      <h3 className="text-base font-bold text-white">Classy Visual Themes</h3>
                      <p className="text-xs text-slate-400">Select your active aesthetic</p>
                    </div>
                  </div>
                  <button onClick={() => setIsThemeModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <div className="mt-4 grid grid-cols-2 gap-2.5 max-h-[60vh] overflow-y-auto pr-1">
                  {Object.values(THEMES).map((t) => {
                    const isSelected = (settings.theme || 'champagne_gold') === t.id;
                    return (
                      <button
                        key={t.id}
                        onClick={() => setSettings(s => ({ ...s, theme: t.id }))}
                        className={`flex items-center gap-2.5 rounded-2xl border p-3 text-left transition-all ${
                          isSelected ? 'border-white/50 bg-slate-800 shadow-md ring-1 ring-white/30' : 'border-slate-800/80 bg-slate-950/50 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex h-7 w-7 shrink-0 items-center justify-center rounded-xl shadow-md" style={{ backgroundColor: t.dotColor }}>
                          {isSelected && <Icon name="check" className="w-4 h-4 text-slate-950 stroke-[3]" />}
                        </div>
                        <div className="min-w-0 flex-1">
                          <span className="block text-xs font-bold text-white truncate">{t.name}</span>
                          <span className="block text-[9px] text-slate-400 truncate">{t.subtitle}</span>
                        </div>
                      </button>
                    );
                  })}
                </div>
                <div className="mt-5 border-t border-slate-800/80 pt-4 flex justify-end">
                  <button onClick={() => setIsThemeModalOpen(false)} className="rounded-xl bg-white px-5 py-2 text-xs font-extrabold text-slate-950 shadow-md">
                    Done
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Manual Entry Modal */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900/95 p-6 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-800/80 pb-3">
                  <h3 className="text-base font-bold text-white">Log Push-Up Record</h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const count = parseInt(form.count.value) || 1;
                    const rec = {
                      id: String(Date.now()),
                      date: form.date.value,
                      count,
                      variation: form.variation.value,
                      notes: form.notes.value,
                      timestamp: new Date(form.date.value).getTime()
                    };
                    setRecords(prev => [rec, ...prev]);
                    setIsAddModalOpen(false);
                  }}
                  className="mt-4 space-y-3"
                >
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Date</label>
                    <input type="date" name="date" defaultValue={todayStr} required className="w-full rounded-xl border border-slate-700/60 bg-slate-950/80 px-3 py-2 text-xs text-white" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Reps Count</label>
                    <input type="number" name="count" defaultValue="20" min="1" required className={`w-full rounded-xl border border-slate-700/60 bg-slate-950/80 px-3 py-2 font-mono-num text-sm font-bold ${themeCfg.accentText}`} />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Variation</label>
                    <select name="variation" defaultValue="Standard" className="w-full rounded-xl border border-slate-700/60 bg-slate-950/80 px-3 py-2 text-xs text-slate-200">
                      {VARIATIONS.map(v => <option key={v} value={v}>{v}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">Notes</label>
                    <input type="text" name="notes" placeholder="Optional notes" className="w-full rounded-xl border border-slate-700/60 bg-slate-950/80 px-3 py-2 text-xs text-white" />
                  </div>
                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-800/80">
                    <button type="button" onClick={() => setIsAddModalOpen(false)} className="rounded-xl border border-slate-700 px-4 py-2 text-xs text-slate-400">Cancel</button>
                    <button type="submit" className={`rounded-xl ${themeCfg.accentBtn} px-4 py-2 text-xs font-extrabold`}>Save Entry</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Preferences & Settings Modal */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/85 p-4 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl border border-slate-800 bg-slate-900/95 p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800/80 pb-3">
                  <h3 className="text-base font-bold text-white">App Preferences & Data</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>
                <div className="mt-4 space-y-4 text-xs">
                  {/* Daily Target Slider */}
                  <div className="rounded-2xl border border-slate-800/80 bg-slate-950/60 p-4">
                    <div className="flex justify-between mb-2">
                      <span className="font-bold text-white">Daily Push-Up Target</span>
                      <span className={`font-mono-num text-sm font-bold ${themeCfg.accentText}`}>{settings.dailyTarget} reps</span>
                    </div>
                    <input
                      type="range"
                      min="20"
                      max="500"
                      step="10"
                      value={settings.dailyTarget}
                      onChange={e => setSettings(s => ({ ...s, dailyTarget: parseInt(e.target.value) }))}
                      className="w-full accent-[#E5C378] cursor-pointer"
                    />
                  </div>

                  {/* Toggle Controls */}
                  <div className="rounded-2xl border border-slate-800/80 bg-slate-950/60 p-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-medium text-white">Audio Synthesizer</span>
                      <input type="checkbox" checked={settings.soundEnabled} onChange={e => setSettings(s => ({ ...s, soundEnabled: e.target.checked }))} className="accent-[#E5C378] h-4 w-4" />
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="font-medium text-white">Voice Count Announcements</span>
                      <input type="checkbox" checked={settings.voiceAnnounce} onChange={e => setSettings(s => ({ ...s, voiceAnnounce: e.target.checked }))} className="accent-[#E5C378] h-4 w-4" />
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="font-medium text-white">Haptic Vibration on Tap</span>
                      <input type="checkbox" checked={settings.vibrateOnTap} onChange={e => setSettings(s => ({ ...s, vibrateOnTap: e.target.checked }))} className="accent-[#E5C378] h-4 w-4" />
                    </div>
                  </div>

                  {/* Import/Export Data */}
                  <div className="rounded-2xl border border-slate-800/80 bg-slate-950/60 p-4 space-y-2.5">
                    <span className="font-bold text-white block">Data Management</span>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={handleExportCSV} className="rounded-xl border border-slate-700/60 bg-slate-900 py-2 text-xs font-semibold text-slate-200 hover:border-slate-500 hover:text-white flex items-center justify-center gap-1.5">
                        <Icon name="download" className="w-3.5 h-3.5" /> Export CSV
                      </button>
                      <button onClick={() => {
                        const blob = new Blob([JSON.stringify({ records, settings }, null, 2)], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `shnoi_backup_${todayStr}.json`;
                        a.click();
                      }} className="rounded-xl border border-slate-700/60 bg-slate-900 py-2 text-xs font-semibold text-slate-200 hover:border-slate-500 hover:text-white flex items-center justify-center gap-1.5">
                        <Icon name="download" className="w-3.5 h-3.5" /> Export JSON
                      </button>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <button onClick={() => fileInputRef.current?.click()} className="rounded-xl border border-slate-700/60 bg-slate-900 py-2 text-xs font-semibold text-slate-200 hover:border-slate-500 hover:text-white flex items-center justify-center gap-1.5">
                        <Icon name="upload" className="w-3.5 h-3.5" /> Import CSV
                      </button>
                      <button onClick={() => {
                        if (confirm('Clear all push-up history and reset levels?')) setRecords([]);
                      }} className="rounded-xl border border-rose-500/20 bg-rose-500/10 py-2 text-xs font-semibold text-rose-400 hover:bg-rose-500/20">
                        Reset All Data
                      </button>
                    </div>
                  </div>

                  <div className="pt-2 flex justify-end border-t border-slate-800/80">
                    <button onClick={() => setIsSettingsOpen(false)} className={`rounded-xl ${themeCfg.accentBtn} px-5 py-2 font-extrabold`}>
                      Done
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
