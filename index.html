<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack | Focus & Flow</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg: #050505;
            --accent: #8b5cf6; /* Vibrant Purple */
            --accent-glow: rgba(139, 92, 246, 0.3);
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Background Aura */
        .aura {
            position: fixed;
            width: 400px;
            height: 400px;
            background: var(--accent-glow);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            animation: flow 15s infinite alternate;
        }

        @keyframes flow {
            0% { transform: translate(-10%, -10%); }
            100% { transform: translate(100%, 50%); }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Main Grid */
        .dashboard {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 24px;
        }

        /* Glass Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Timer Section */
        .timer-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #timer-display {
            font-size: 5rem;
            font-weight: 800;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .timer-controls button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 0 5px;
        }

        .timer-controls button:active { transform: scale(0.95); }

        /* Task List Section */
        .task-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 12px;
            color: white;
            flex-grow: 1;
            outline: none;
        }

        #task-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .task-item {
            background: rgba(255,255,255,0.02);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideInLeft 0.4s ease-out;
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            #timer-display { font-size: 4rem; }
            header { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="aura"></div>

    <div class="container">
        <!-- Navigation -->
        <header>
            <div class="logo">STUDYTRACK.</div>
            <div id="date-display" style="color: var(--text-dim); font-size: 0.9rem;"></div>
        </header>

        <main class="dashboard">
            <!-- Left Side: Focus Timer -->
            <section class="card timer-container">
                <span style="text-transform: uppercase; letter-spacing: 2px; font-size: 0.7rem; color: var(--accent);">Focus Mode</span>
                <div id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button id="start-btn">Start Session</button>
                    <button id="reset-btn" style="background: transparent; border: 1px solid var(--border);">Reset</button>
                </div>
            </section>

            <!-- Right Side: Tasks -->
            <section class="card">
                <h2 style="margin-bottom: 20px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="check-circle"></i> Daily Goals
                </h2>
                <div class="task-input-group">
                    <input type="text" id="task-input" placeholder="What are we studying?">
                    <button id="add-task" style="background: var(--accent); border: none; width: 45px; height: 45px; border-radius: 12px; color: white; cursor: pointer;">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
                <ul id="task-list">
                    <!-- Tasks will appear here -->
                    <div class="task-item" style="color: var(--text-dim); font-size: 0.8rem;">No tasks yet...</div>
                </ul>
            </section>
        </main>

        <!-- Stats Section -->
        <section class="card" style="margin-top: 24px; display: flex; justify-content: space-around; text-align: center;">
            <div>
                <h4 style="color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase;">Sessions</h4>
                <p id="stat-sessions" style="font-size: 1.5rem; font-weight: 800;">0</p>
            </div>
            <div style="width: 1px; background: var(--border);"></div>
            <div>
                <h4 style="color: var(--text-dim); font-size: 0.7rem; text-transform: uppercase;">Focus Time</h4>
                <p id="stat-time" style="font-size: 1.5rem; font-weight: 800;">0h</p>
            </div>
        </section>
    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Date Display
        const options = { weekday: 'long', month: 'long', day: 'numeric' };
        document.getElementById('date-display').innerText = new Date().toLocaleDateString(undefined, options);

        // --- THEME & UI ANIMATION LOGIC ---
        // This makes the UI feel "alive"
        document.querySelectorAll('.card').forEach((card, index) => {
            card.style.animationDelay = `${index * 0.1}s`;
        });

        // --- YOUR DATA LOGIC HERE ---
        // (This is where you can paste your existing JavaScript from your original index.html)
        // Below is a basic placeholder to keep the app functional:

        let timeLeft = 1500;
        let timerId = null;

        const timerDisplay = document.getElementById('timer-display');
        const startBtn = document.getElementById('start-btn');

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        startBtn.addEventListener('click', () => {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = 'Resume';
            } else {
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft === 0) clearInterval(timerId);
                }, 1000);
                startBtn.textContent = 'Pause';
            }
        });

        // --- END DATA LOGIC ---
    </script>
</body>
</html>
